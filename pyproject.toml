[tool.mypy]
python_version = "3.14"
files = ["P_Bits", "Tests"]
exclude = '^(Data|Figures|Notes|Hardware|Analysis|Experiments|Scratchpad)/'
strict = true
enable_error_code = ["possibly-undefined"]
warn_unreachable = true
cache_dir = "~/.cache/mypy/pbit"

disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["sympy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]